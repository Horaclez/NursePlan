<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="Q-PLAN: Diseño colaborativo, trazabilidad metodológica, ciclo PHVA y auditoría de Planes de Mejora Continua en salud.">
  <title>Q-PLAN — Planes de Mejora Continua en Salud</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar no-print">
    <div class="topbar-inner">
      <div class="brand-area">
        <img src="./icon-192.png" alt="Q-PLAN" class="brand-logo">
        <div>
          <span class="brand-title">Q-PLAN</span>
          <span class="brand-sub">Mejora Continua en Salud</span>
        </div>
      </div>

      <div class="plan-controls">
        <select id="plan-selector" class="select select-plan" aria-label="Seleccionar Plan de Mejora"></select>
        <button type="button" id="btn-new-plan" class="btn btn-secondary btn-sm" title="Crear nuevo plan en blanco">+ Nuevo</button>
        <button type="button" id="btn-duplicate-plan" class="btn btn-ghost btn-sm" title="Duplicar plan actual">Duplicar</button>
        <button type="button" id="btn-templates" class="btn btn-ghost btn-sm" title="Cargar casos clínicos modelo">Casos Modelo</button>
        <button type="button" id="btn-delete-plan" class="btn btn-ghost btn-sm" title="Eliminar plan actual">🗑</button>
      </div>

      <div class="action-controls">
        <button type="button" id="btn-collab" class="btn btn-secondary btn-sm" title="Trabajo colaborativo en sala P2P o fusión JSON">
          <span id="collab-dot" class="status-dot dot-offline"></span>
          <span id="collab-btn-text">Equipo</span>
        </button>
        <button type="button" id="btn-audit" class="btn btn-teal-soft btn-sm" title="Ver auditoría de coherencia metodológica">Auditoría: 0%</button>
        <button type="button" id="btn-export-json" class="btn btn-ghost btn-sm" title="Exportar respaldo JSON">Exportar</button>
        <button type="button" id="btn-import-json" class="btn btn-ghost btn-sm" title="Importar respaldo JSON">Importar</button>
        <input type="file" id="import-json-input" accept=".json,application/json" hidden>
        <button type="button" id="btn-theme" class="btn btn-ghost btn-sm" title="Cambiar tema claro/oscuro">🌙 Oscuro</button>
      </div>
    </div>

    <nav id="stage-stepper" class="stepper-bar" aria-label="Etapas del Plan de Mejora Continua"></nav>
  </header>

  <main class="main-container">
    <div id="stage-content"></div>

    <div class="stage-footer-nav no-print">
      <button type="button" id="btn-prev-stage" class="btn btn-secondary">← Etapa Anterior</button>
      <button type="button" id="btn-next-stage" class="btn btn-primary">Siguiente Etapa →</button>
    </div>
  </main>

  <div id="toast-banner" class="toast-banner no-print" role="status" aria-live="polite"></div>

  <!-- Modal Auditoría Metodológica -->
  <div id="audit-modal" class="modal-backdrop no-print" hidden>
    <div class="modal-card modal-lg">
      <div class="modal-header">
        <h3>Auditoría de Coherencia Metodológica</h3>
        <button type="button" class="btn-icon" data-close-modal aria-label="Cerrar">✕</button>
      </div>
      <div id="audit-modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- Modal Colaboración en Equipo -->
  <div id="collab-modal" class="modal-backdrop no-print" hidden>
    <div class="modal-card modal-lg">
      <div class="modal-header">
        <h3>Trabajo Colaborativo en Equipo (Tiempo Real y Offline)</h3>
        <button type="button" class="btn-icon" data-close-modal aria-label="Cerrar">✕</button>
      </div>
      <div id="collab-modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- Modal Casos Clínicos Modelo -->
  <div id="templates-modal" class="modal-backdrop no-print" hidden>
    <div class="modal-card">
      <div class="modal-header">
        <h3>Biblioteca de Casos Clínicos Modelo</h3>
        <button type="button" class="btn-icon" data-close-modal aria-label="Cerrar">✕</button>
      </div>
      <div id="templates-modal-body" class="modal-body"></div>
    </div>
  </div>

  <script src="./js/qrcode.js"></script>
  <script src="./js/sample-case.js"></script>
  <script src="./js/state.js"></script>
  <script src="./js/collab.js"></script>
  <script src="./js/diagrams.js"></script>
  <script src="./js/stages-1-4.js"></script>
  <script src="./js/stages-5-8.js"></script>
  <script src="./js/report.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
